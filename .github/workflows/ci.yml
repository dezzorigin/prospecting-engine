name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (0 error)
        run: npm run lint

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Static output contains all routes
        run: |
          test -s out/index.html
          test -s out/app.html
          test -s out/app/discover.html
          test -s out/app/template.html
          test -s out/d/kopi-ulee-kareng.html
          test -s out/app/prospek/p-kopi-ulee-kareng.html
          test -s out/_worker.js
          grep -q "Cari usaha tanpa website, kirim demo, closing deal" out/index.html
          grep -q "Kopi Ulee Kareng" out/app.html
          grep -q "Tempat Nongkrong Favorit" out/d/kopi-ulee-kareng.html

      - name: Upload static output
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/

  # Tes end-to-end Playwright — variasi CI repo ini (sesuai stack:
  # Next.js + Prisma + Playwright). Menguji alur inti sungguhan di
  # browser: landing, dashboard, tambah prospek, ubah stage, aktivitas,
  # buat demo, buka demo, Discover + import.
  playwright-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Serve + Playwright tests
        run: |
          set -euo pipefail
          (PORT=8336 node scripts/serve.mjs out > /tmp/pe-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8336/ >/dev/null 2>&1 && break
            sleep 1
          done
          npx playwright test

  # Gate keamanan dependensi produksi (pengganti `npm audit --omit=dev`).
  # `npm audit --omit=dev` tetap melaporkan advisory yang hanya reachable
  # lewat dev deps (bug npm yang diketahui), sehingga job audit lama gagal
  # deterministik pada temuan HIGH dev-only padahal pohon produksi bersih.
  # Sweep ini memeriksa HANYA dependensi produksi dan tetap FAIL kalau ada
  # temuan high/critical di prod.
  #
  # DATA SOURCE: OSV (https://osv.dev), bukan lagi API GitHub Advisory
  # Database. Alasan (diselidiki di repo orteam, 5 kegagalan CI): versi
  # pertama skrip ini memakai GITHUB_TOKEN ke api.github.com/advisories
  # dan gagal 5x dgn 401 Bad credentials — padahal skrip, token, dan
  # endpoint masing-masing terbukti baik. OSV memirror GHSA, tanpa auth,
  # dan menjawab semua paket dalam SATU POST batch — tanpa lotre token.
  #
  # CATATAN KLASIFIKASI: `playwright` + `@playwright/test` HARUS tetap
  # di devDependencies — di dependencies ia menyeret ~190 paket ke
  # klasifikasi produksi. Pelajaran yang sama berlaku untuk `shadcn` CLI.
  advisory-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Advisory sweep (production, high and above)
        run: python3 scripts/advisory-sweep.py

  # Tes unit Pages Worker (node --test, tanpa dependensi eksternal):
  # /api/status, shellFor, resolusi .html, fallback deep link, 404.
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run worker unit tests
        run: npm test

  # Smoke test end-to-end lokal: sajikan out/ dengan scripts/serve.mjs
  # (resolusi path ala Cloudflare Pages + shell fallback — lihat
  # komentar di file itu), lalu curl. Yang diuji adalah KONTRAK DEMO:
  # landing berisi hero + link GitHub + preview produk + fitur + footer,
  # /app menyajikan seed prospek di HTML statis, /d/<slug> seed
  # ter-render, dan deep link id/slug BARU tetap 200 via shell fallback.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Serve + smoke test
        run: |
          set -euo pipefail
          (PORT=8336 node scripts/serve.mjs out > /tmp/pe-serve.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8336/ >/dev/null 2>&1 && break
            sleep 1
          done
          # Landing: hero + navbar GitHub + preview produk + fitur + footer
          curl -fsS http://127.0.0.1:8336/ | grep -q "Cari usaha tanpa website, kirim demo, closing deal" \
            && echo "landing: hero OK"
          curl -fsS http://127.0.0.1:8336/ | grep -q "github.com/dezzorigin/prospecting-engine" \
            && echo "landing: link GitHub OK"
          curl -fsS http://127.0.0.1:8336/ | grep -q "Dashboard — Pipeline" \
            && echo "landing: preview produk OK"
          curl -fsS http://127.0.0.1:8336/ | grep -q "Satu mesin, dari cari sampai closing" \
            && echo "landing: fitur OK"
          curl -fsS http://127.0.0.1:8336/ | grep -q "Lisensi MIT" \
            && echo "landing: footer OK"
          # Dashboard: 200 + seed prospek ter-render di HTML statis
          curl -fsS http://127.0.0.1:8336/app | grep -q "Kopi Ulee Kareng" \
            && echo "dashboard: seed prospek OK"
          curl -fsS http://127.0.0.1:8336/app | grep -q "Rp14.700.000" \
            && echo "dashboard: nilai pipeline OK"
          # Demo seed: headline ter-render di HTML statis
          curl -fsS http://127.0.0.1:8336/d/kopi-ulee-kareng | grep -q "Tempat Nongkrong Favorit" \
            && echo "demo: seed OK"
          # Deep link id/slug BARU: 200 via shell fallback
          curl -fsS -o /dev/null http://127.0.0.1:8336/app/prospek/p-baru-xyz \
            && echo "detail: shell fallback OK"
          curl -fsS -o /dev/null http://127.0.0.1:8336/d/usaha-baru-abc1 \
            && echo "demo: shell fallback OK"
          # Aset: favicon tidak 404
          curl -fsS -o /dev/null http://127.0.0.1:8336/favicon.ico && echo "favicon: 200 OK"
          # Rute tak dikenal: 404
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8336/tidak-ada)
          [ "$code" = "404" ] || (echo "rute tak dikenal harus 404, dapat $code" && exit 1)
          echo "404: OK"

  # Dokumen wajib ada + diagram SVG benar-benar SVG (bukan placeholder).
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check docs
        run: |
          set -euo pipefail
          for f in README.md PRD.md CHANGELOG.md docs/README.md docs/PRD.MD docs/SDD.MD \
              docs/DESIGN.MD docs/ARCHITECTURE.md docs/SCHEMA.md docs/SECURITY.md \
              docs/DEPLOYMENT.md docs/DEMO.md docs/DIAGRAMS.html .env.example; do
            test -s "$f" || (echo "hilang/kosong: $f" && exit 1)
          done
          grep -q "<svg" docs/DIAGRAMS.html || (echo "DIAGRAMS.html tanpa SVG" && exit 1)
          grep -q "docs/screenshots/01-landing-hero.png" README.md \
            || (echo "README tanpa screenshot landing" && exit 1)
          grep -q "docs/demo/demo.mp4" README.md \
            || (echo "README tanpa video demo" && exit 1)
          test -s docs/demo/demo.mp4 || (echo "video demo hilang" && exit 1)
          test -s docs/screenshots/03-dashboard.png || (echo "screenshot dashboard hilang" && exit 1)
          test -s docs/screenshots/07-demo.png || (echo "screenshot demo hilang" && exit 1)
          echo "docs: semua berkas ada"
